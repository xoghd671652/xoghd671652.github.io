<g stroke="#2f6f5e" stroke-width="2.5" fill="none"><path d="M232 77 C330 77 330 143 420 143"/><path d="M232 121 C330 121 330 143 420 143"/><path d="M232 165 C330 165 330 143 420 143"/><path d="M232 209 C330 209 330 143 420 143"/></g>
