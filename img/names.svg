<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="여러 이름 표기를 한 사람으로 묶는 예시 (가상 데이터)">
<style>text{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.h{font-size:15px;font-weight:700;fill:#1f2a27}.s{font-size:14px;fill:#333}.n{font-size:11px;fill:#6b6b6b}</style>
